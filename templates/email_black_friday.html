<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=300, height=600, initial-scale=1.0" />
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
</head>

<style>

    @media (prefers-color-scheme: dark) {

        body {
            background: linear-gradient(lightgray, #121212) !important;
            color: whitesmoke !important;
        }
        .logo {
            filter: invert(90%);
        }
        .hline {
            background-color: whitesmoke !important;
        }
    }
</style>
<body style="background: linear-gradient(lightgray, white); color: #121212; display: block; width: 100%; height:100vh; color-scheme: only light;">
    <div class="email-body" style="display: block; width: 100%; height:100%;">
        <div class="email-content" style="display: block; width: 90%; margin:auto; padding-top: 2rem; padding-bottom: 2rem;">
            <div class="logo" style="background-image: url(https://pansonjoieria.com/media/logo/gran); width:100%; height:3rem; background-position: center; background-size: contain; background-repeat: no-repeat;"></div>
            <div class="hline" style="width: 100%; height: 1px; background-color: #121212; margin-top: 1rem"></div>
            <br>
            Hola,<br>
            <br>
            Aqui tens el teu codi de descompte adicional per a fer servir en una compra fins al dia: XX/XX/XXXX.<br>
            <h1>{{code}}</h1><br>
            Aquest codi et proporcionara 5% de descompte.<br>
            <br>
            L'equip de Panson<br>

        </div>
    </div>
</body>

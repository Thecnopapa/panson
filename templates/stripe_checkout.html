{% extends "base.html" %}


{% block imports %}

    <link href='/style/stripe.css' rel='stylesheet'>
    <script src="https://js.stripe.com/basil/stripe.js"></script>
    <script>
        const stripe = Stripe("{{ pub_key }}");
        //console.log("Stripe pub key:", "{{pub_key}}");

    </div>

</div>

{% endblock %}
